<text x="60" y="52" font-family="Helvetica,Arial" font-size="31" font-weight="bold" fill="#264653">What the pipeline hands the editor</text>
<rect x="60" y="90" width="1180" height="74" rx="7" fill="#8d99ae" opacity="0.9"/><text x="78" y="136" font-family="Helvetica,Arial" font-size="27" font-weight="bold" fill="#fff">58,122</text><text x="1258" y="135" font-family="Helvetica,Arial" font-size="23" fill="#264653">cells in the corpus</text><rect x="60" y="190" width="380" height="74" rx="7" fill="#264653" opacity="0.9"/><text x="78" y="236" font-family="Helvetica,Arial" font-size="27" font-weight="bold" fill="#fff">18,718</text><text x="458" y="235" font-family="Helvetica,Arial" font-size="23" fill="#264653">carry ink (32%) - the rest need no reading</text><rect x="60" y="290" width="125" height="74" rx="7" fill="#2a9d8f" opacity="0.9"/><text x="78" y="336" font-family="Helvetica,Arial" font-size="27" font-weight="bold" fill="#fff">6,140</text><text x="203" y="335" font-family="Helvetica,Arial" font-size="23" fill="#264653">auto-accepted: SoM and PyLaia agree, 0.88% error</text><rect x="60" y="390" width="255" height="74" rx="7" fill="#e9c46a" opacity="0.9"/><text x="78" y="436" font-family="Helvetica,Arial" font-size="27" font-weight="bold" fill="#fff">12,578</text><text x="333" y="435" font-family="Helvetica,Arial" font-size="23" fill="#264653">left for the RA to correct</text>
<text x="60" y="494" font-family="Helvetica,Arial" font-size="21" fill="#8d99ae">Auto-accept rate measured on the six proxy-GT pages (32.8%) and projected across the inked cells.</text>
