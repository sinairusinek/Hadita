        /**
         * Load and parse METS.xml or fallback to mets.json
         */
        async function loadMets(folderName) {
            state.currentManuscript = folderName;
            const manuscript = state.manuscripts.find(m => m.manuscriptFolder === folderName);
            if (!manuscript) {
                console.error('Manuscript not found:', folderName);
                return;
            }
            
            // Try mets.xml first
            const metsXmlPath = buildManuscriptPath(manuscript, 'mets.xml');
            const metsXmlUrl = withBase(metsXmlPath);
            
            try {
                const response = await fetch(metsXmlUrl);
                if (response.ok) {
                    // Successfully found mets.xml
                    const xmlText = await response.text();
                    const parser = new DOMParser();
                    state.metsData = parser.parseFromString(xmlText, 'application/xml');

                    if (state.metsData.getElementsByTagName('parsererror').length > 0) {
                        throw new Error('Failed to parse METS.xml');
                    }

                    // Extract pages from METS
                    extractPages();
                    return;
                }
            } catch (error) {
                console.log('mets.xml not found or failed to load, trying mets.json fallback...');
            }
            
            // Fallback to mets.json (then mets.csv)
            const metsJsonPath = buildManuscriptPath(manuscript, 'mets.json');
            const metsJsonUrl = withBase(metsJsonPath);

            try {
                const response = await fetch(metsJsonUrl);
                if (response.ok) {
                    const jsonData = await response.json();

                    // Parse JSON format: array of {image: "path", pagexml: "path"}
                    state.pages = jsonData.map((page, index) => ({
                        index: index + 1,
                        image: page.image,
                        text: page.pagexml,
                        compare: page.compare || null
                    }));
                    populateCompareOptions();

                    console.log(`Loaded ${state.pages.length} pages from mets.json`);
                    return;
                }
            } catch (error) {
                console.log('mets.json not found or failed to load, trying mets.csv...', error);
            }

            // Fallback to mets.csv
            const metsCsvPath = buildManuscriptPath(manuscript, 'mets.csv');
            const metsCsvUrl = withBase(metsCsvPath);

            try {
                const resp = await fetch(metsCsvUrl);
                if (!resp.ok) {
                    throw new Error('Neither mets.xml, mets.json nor mets.csv found');
                }
                const csvText = await resp.text();
                const lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length === 0) throw new Error('Empty CSV');

                // Parse CSV rows; support quoted fields
                const parsed = lines.map(line => {
                    const fields = [];
                    let cur = '';
                    let inQuotes = false;
                    let quoteChar = null;
                    for (let i = 0; i < line.length; i++) {
                        const ch = line[i];
                        if (!inQuotes && (ch === '"' || ch === '\'')) {
                            inQuotes = true;
                            quoteChar = ch;
                            continue;
                        }
                        if (inQuotes && ch === quoteChar) {
                            // peek next char: if another quote, it's an escaped quote
                            if (line[i+1] === quoteChar) { cur += quoteChar; i++; continue; }
                            inQuotes = false; quoteChar = null; continue;
                        }
                        if (!inQuotes && ch === ',') { fields.push(cur.trim()); cur = ''; continue; }
                        cur += ch;
                    }
                    fields.push(cur.trim());
                    return fields;
                });

                // Detect header row
                let start = 0;
                const firstRowLower = parsed[0].map(c => c.toLowerCase());
                if (firstRowLower.includes('image') || firstRowLower.includes('page') || firstRowLower.includes('pagexml') || firstRowLower.includes('path')) {
                    start = 1;
                }

                const pages = [];
                for (let i = start; i < parsed.length; i++) {
                    const r = parsed[i];
                    if (!r || r.length === 0) continue;
                    const image = r[0] || null;
                    const pagexml = r[1] || null;
                    pages.push({ index: pages.length + 1, image, text: pagexml });
                }

                if (pages.length === 0) throw new Error('No rows parsed from CSV');
                state.pages = pages;
                console.log(`Loaded ${state.pages.length} pages from mets.csv`);
                return;
            } catch (error) {
                throw new Error(`Failed to load manuscript metadata: ${error.message}`);
            }
        }

        /**
         * Extract page information from METS
         */
        function extractPages() {
            const mets = state.metsData;

            // Build file ID to href map from fileSec
            const fileMap = {};
            
            // Fallback: manually iterate through all elements to find files and FLocat elements
            const allFiles = mets.querySelectorAll('*');
            allFiles.forEach(elem => {
                if (elem.getAttribute('ID') && elem.getAttribute('MIMETYPE')) {
                    // This is a file element
                    const fileId = elem.getAttribute('ID');
                    const flocat = elem.querySelector('*');
                    if (flocat) {
                        let href = flocat.getAttribute('href') || flocat.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
                        if (!href) {
                            // Try to get any href-like attribute
                            for (let i = 0; i < flocat.attributes.length; i++) {
                                const attr = flocat.attributes[i];
                                if (attr.name.includes('href')) {
                                    href = attr.value;
                                    break;
                                }
                            }
                        }
                        if (href) {
                            fileMap[fileId] = href;
                        }
                    }
                }
            });

            // Extract pages from structMap
            state.pages = [];
            
            // Find all page divisions
            const pageDivs = mets.querySelectorAll('[ORDER]');
            
            pageDivs.forEach((pageDiv) => {
                const order = pageDiv.getAttribute('ORDER');
                const fileRefs = [];
                
                // Find all file references in this page division
                const areas = pageDiv.querySelectorAll('[FILEID]');
                areas.forEach(area => {
                    const fileId = area.getAttribute('FILEID');
                    if (fileId && fileMap[fileId]) {
                        fileRefs.push(fileMap[fileId]);
                    }
                });
                
                // Separate image and text files
                const pageFiles = {};
                fileRefs.forEach(filePath => {
                    if (filePath.match(/\.(jpg|jpeg|png|gif)$/i)) {
                        pageFiles.image = filePath;
                    } else if (filePath.match(/\.xml$/i)) {
                        pageFiles.text = filePath;
                    }
                });

                if (pageFiles.image || pageFiles.text) {
                    state.pages.push({
                        index: parseInt(order) || state.pages.length + 1,
                        image: pageFiles.image,
                        text: pageFiles.text
                    });
                }
            });
            
            // Sort pages by index
            state.pages.sort((a, b) => a.index - b.index);
        }

        /**
         * Render page list in sidebar
         */
        function renderPages() {
            const pageList = document.getElementById('pageList');
            pageList.innerHTML = state.pages.map((page, idx) => `
                <li class="page-item ${idx === 0 ? 'active' : ''}" data-index="${idx}">
                    Page ${page.index}
                </li>
            `).join('');

            document.querySelectorAll('.page-item').forEach(item => {
                item.addEventListener('click', () => {
                    const index = parseInt(item.dataset.index);
                    loadPage(index);
                });
            });

            updatePageNavButtons();
        }

        function updatePageNavButtons() {
            const prevBtn = document.getElementById('prevPageButton');
            const nextBtn = document.getElementById('nextPageButton');
            if (!prevBtn || !nextBtn) return;
            prevBtn.disabled = state.currentPageIndex <= 0;
            nextBtn.disabled = state.currentPageIndex >= state.pages.length - 1;
        }

        /**
         * Load and display a specific page
         */
        async function loadPage(index) {
            state.currentPageIndex = index;
            const page = state.pages[index];

            if (!page) return;

            // Update active page in sidebar
            document.querySelectorAll('.page-item').forEach((item, idx) => {
                item.classList.toggle('active', idx === index);
            });

            // Clear polygons when page changes
            clearPolygons();
            state.polygonsVisible = false;
            const polygonsCheckbox = document.getElementById('settingsPolygons');
            if (polygonsCheckbox) {
                polygonsCheckbox.checked = false;
            }

            // Load image
            if (page.image) {
                loadImage(page.image);
            } else {
                clearImage();
            }

            // Load text, after refreshing the comparison for this page.
            if (page.text) {
                loadComparison().then(() => loadPageXml(page.text));
            } else {
                clearText();
            }

            updatePageNavButtons();
        }

        /**
         * Load image using Leaflet
         */
        function loadImage(imagePath) {
            const imagePanel = document.querySelector('.image-panel');
            
            // Initialize or clear existing map
            if (state.leafletMap) {
                state.leafletMap.remove();
            }

            // Create map with SimpleCoRS for image coordinates
            state.leafletMap = L.map('leaflet-map', {
                crs: L.CRS.Simple,
                minZoom: -5,
                maxZoom: 4,
                zoomSnap: 0.25,
                zoomDelta: 0.25,
                wheelPxPerZoomLevel: 120
            });

            // Create image overlay with proper bounds
            const img = new Image();
            img.onload = () => {
                // Use PageXML dimensions if available, otherwise use image dimensions
                const width = state.pageWidth || img.width;
                const height = state.pageHeight || img.height;
                
                // Store dimensions for polygon rendering
                state.imageWidth = width;
                state.imageHeight = height;
                
                // For SimpleCoRS with images, we need to invert Y-axis
                // PageXML: Y increases downward (0 at top)
                // SimpleCoRS: Y increases upward (0 at bottom)
                // So bounds should be [[height, 0], [0, width]] instead of [[0, 0], [height, width]]
                const bounds = [[height, 0], [0, width]];
                console.log(`Setting image bounds to ${JSON.stringify(bounds)} for image ${width}x${height}`);
                
                // Add image overlay
                const manuscript = state.manuscripts.find(m => m.manuscriptFolder === state.currentManuscript);
                // imagePath from METS already includes any subfolder (e.g., "p012.jpg" or "images/p012.jpg")
                // so we build the path directly without adding ImagesSubfolder
                const imageBasePath = buildManuscriptPath(manuscript, imagePath);
                const imageUrl = withBase(imageBasePath);
                const overlay = L.imageOverlay(imageUrl, bounds, {
                    attribution: ''
                }).addTo(state.leafletMap);
                
                // Fit bounds to viewport. invalidateSize() first: the panel is
                // still settling when the image onload fires, so Leaflet would
                // otherwise measure a short container and leave the page cropped.
                state.leafletMap.invalidateSize(false);
                state.leafletMap.fitBounds(bounds, { padding: [10, 10], animate: false });
                state.fitBounds = bounds;
                requestAnimationFrame(() => {
                    state.leafletMap.invalidateSize(false);
                    state.leafletMap.fitBounds(bounds, { padding: [10, 10], animate: false });
                });

                // Restore saved zoom level for this manuscript only if explicitly set
                try {
                    const savedZoomStr = localStorage.getItem(`zoom_${state.currentManuscript}_set`);
                    if (savedZoomStr === 'true') {
                        const savedZoom = parseFloat(localStorage.getItem(`zoom_${state.currentManuscript}`));
                        if (!isNaN(savedZoom)) {
                            state.leafletMap.setZoom(savedZoom, { animate: false });
                        }
                    }
                } catch {}
                
                // Add click handler to map to unlock highlight
                state.leafletMap.on('click', (e) => {
                    // Only unlock if clicking on the map itself, not on a polygon
                    if (!e.originalEvent.target.classList.contains('leaflet-interactive')) {
                        state.highlightLocked = false;
                        clearHighlight();
                    }
                });

                // Persist zoom level per manuscript (mark as explicitly set)
                state.leafletMap.on('zoomend', () => {
                    try {
                        localStorage.setItem(`zoom_${state.currentManuscript}`, String(state.leafletMap.getZoom()));
                        localStorage.setItem(`zoom_${state.currentManuscript}_set`, 'true');
                    } catch {}
                });
                
                // If polygons were requested before image loaded, render them now
                if (state.polygonsVisible && state.currentPageXml) {
                    setTimeout(() => renderPolygons(), 100);
                }
            };
            img.onerror = () => {
                imagePanel.innerHTML = `<div class="image-error">Failed to load image</div>`;
            };
            const manuscript = state.manuscripts.find(m => m.manuscriptFolder === state.currentManuscript);
            // imagePath from METS already includes any subfolder
            const imgBasePath = buildManuscriptPath(manuscript, imagePath);
            img.src = withBase(imgBasePath);
        }

        /**
         * Clear image display
         */
        function clearImage() {
            if (state.leafletMap) {
                state.leafletMap.remove();
                state.leafletMap = null;
            }
            const imagePanel = document.querySelector('.image-panel');
            imagePanel.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #999;">No image for this page</div>';
        }

        /**
         * Load and parse PageXML
         */
        async function loadPageXml(xmlPath) {
            const textContent = document.getElementById('textContent');
            
            try {
                const manuscript = state.manuscripts.find(m => m.manuscriptFolder === state.currentManuscript);
                if (!manuscript) {
                    throw new Error('Manuscript not found');
                }
                const xmlBasePath = buildManuscriptPath(manuscript, xmlPath);
                console.log(`Loading PageXML from: ${xmlBasePath}`);
                const response = await fetch(withBase(xmlBasePath));
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'application/xml');

                if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
                    throw new Error('Failed to parse PageXML');
                }

                // Store XML doc for polygon rendering
                state.currentPageXml = xmlDoc;
                
                // Extract page dimensions from PageXML - handle namespaced and non-namespaced
                let pageElement = xmlDoc.querySelector('Page');
                if (!pageElement) {
                    // Try finding by tag name
                    const pages = xmlDoc.getElementsByTagName('Page');
                    if (pages.length === 0) {
                        // Try with any namespace
                        for (let elem of xmlDoc.querySelectorAll('*')) {
                            if (elem.localName === 'Page' || elem.tagName === 'Page') {
                                pageElement = elem;
                                break;
                            }
                        }
                    } else {
                        pageElement = pages[0];
                    }
                }
                if (pageElement) {
                    state.pageWidth = parseInt(pageElement.getAttribute('imageWidth')) || 0;
                    state.pageHeight = parseInt(pageElement.getAttribute('imageHeight')) || 0;
                }

                // Extract text grouped by regions (TextRegion + TableCell)
                const textRegions = collectRegions(xmlDoc);
                const regionGroups = [];

                textRegions.forEach((region) => {
                    const regionId = region.getAttribute('id') || 'Unknown Region';
                    const textLines = [];
                    const lineElements = collectLines(region);

                    lineElements.forEach((line, lineIdx) => {
                        // Get Unicode element
                        let unicodeElement = line.querySelector('Unicode');
                        if (!unicodeElement) {
                            // Try finding by tag name
                            const unicodes = line.getElementsByTagName('Unicode');
                            if (unicodes.length > 0) {
                                unicodeElement = unicodes[0];
                            } else {
                                // Try with namespace
                                for (let elem of line.querySelectorAll('*')) {
                                    if (elem.localName === 'Unicode' || elem.tagName === 'Unicode') {
                                        unicodeElement = elem;
                                        break;
                                    }
                                }
                            }
                        }
                        if (unicodeElement && unicodeElement.textContent?.trim()) {
                            textLines.push({
                                number: regionGroups.reduce((sum, g) => sum + g.textLines.length, 0) + lineIdx + 1,
                                text: unicodeElement.textContent.trim(),
                                id: line.getAttribute('id') || `line_${regionId}_${lineIdx}`
                            });
                        }
                    });

                    if (textLines.length > 0) {
                        regionGroups.push({
                            regionId: regionId,
                            label: regionLabel(region),
                            textLines: textLines
                        });
                    }
                });

                if (state.compareCells) {
                    renderComparisonText(xmlDoc, textContent);
                } else if (regionGroups.length === 0) {
                    textContent.innerHTML = '<p class="no-text">No text content found in this page</p>';
                } else {
                    textContent.innerHTML = regionGroups.map(group => `
                        <div class="text-region-heading">${escapeHtml(group.label || group.regionId)}</div>
                        ${group.textLines.map(line => `
                            <div class="text-line" data-line-id="${escapeHtml(line.id)}">
                                <span class="text-line-number">${line.number}</span>
                                <div class="text-line-content">
                                    ${escapeHtml(line.text)}
                                </div>
                            </div>
                        `).join('')}
                    `).join('');
                    
                    // Add click handlers to text lines
                    document.querySelectorAll('.text-line').forEach(lineElement => {
                        lineElement.addEventListener('click', () => {
                            const lineId = lineElement.dataset.lineId;
                            console.log(`Text line ${lineId} clicked`);
                            state.highlightLocked = true;
                            highlightLineAndPolygon(lineId, true);
                        });
                    });
                }
            } catch (error) {
                console.error('Error loading PageXML:', error);
                textContent.innerHTML = `<div class="text-error">Error loading text: ${escapeHtml(error.message)}</div>`;
            }
        }

        /**
         * Clear text display
         */
        function clearText() {
            document.getElementById('textContent').innerHTML = '<p class="no-text">No text content available for this page</p>';
        }

        /**
         * Return to library view
         */



        /**
         * Map a PAGE doc's table cells to "row,col" -> text.
         * Used to diff a model's output against the ground truth page.
         */
        function cellTextMap(doc) {
            const m = new Map();
            for (const elem of doc.querySelectorAll('*')) {
                if ((elem.localName || elem.tagName) !== 'TableCell') continue;
                const row = elem.getAttribute('row'), col = elem.getAttribute('col');
                if (row === null || col === null) continue;
                let text = '';
                for (const u of elem.querySelectorAll('*')) {
                    if ((u.localName || u.tagName) === 'Unicode') {
                        text = (u.textContent || '').trim();
                        break;
                    }
                }
                m.set(`${row},${col}`, text);
            }
            return m;
        }

        /**
         * Fill the "Compare with" dropdown from the model keys present in
         * mets.json, and re-render the page when the selection changes.
         */
        function populateCompareOptions() {
            const row = document.getElementById('compareRow');
            const sel = document.getElementById('compareSelect');
            if (!row || !sel) return;

            const keys = new Set();
            for (const pg of state.pages) {
                if (pg.compare) Object.keys(pg.compare).forEach(k => keys.add(k));
            }
            if (!keys.size) { row.style.display = 'none'; return; }

            const sorted = [...keys].sort();
            sel.innerHTML = '<option value="">(ground truth only)</option>'
                + sorted.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');
            sel.value = state.compareModel && keys.has(state.compareModel) ? state.compareModel : '';
            row.style.display = '';

            if (!sel.dataset.bound) {
                sel.dataset.bound = '1';
                sel.addEventListener('change', async () => {
                    state.compareModel = sel.value;
                    const page = state.pages[state.currentPageIndex];
                    await loadComparison();
                    if (page && page.text) await loadPageXml(page.text);
                    if (state.polygonsVisible) renderPolygons();
                });
            }
        }

        /**
         * Render the GT-vs-prediction table for the current page: every cell
         * where the two disagree, in reading order, worst first.
         */
        function renderComparisonText(gtDoc, el) {
            const rows = [];
            for (const elem of gtDoc.querySelectorAll('*')) {
                if ((elem.localName || elem.tagName) !== 'TableCell') continue;
                const r = elem.getAttribute('row'), c = elem.getAttribute('col');
                const gt = cellText(elem);
                const pred = state.compareCells.get(`${r},${c}`) || '';
                const verdict = cellVerdict(gt, pred);
                if (verdict === 'empty' || verdict === 'match') continue;
                rows.push({ r: parseInt(r, 10), c: parseInt(c, 10), gt, pred, verdict,
                            id: elem.getAttribute('id') || '', label: regionLabel(elem) });
            }
            rows.sort((a, b) => a.r - b.r || a.c - b.c);

            if (!rows.length) {
                el.innerHTML = '<p class="no-text">Every non-empty cell matches the ground truth.</p>';
                return;
            }
            el.innerHTML = `
                <div class="text-region-heading">
                    ${rows.length} differing cells &mdash; ground truth vs ${escapeHtml(state.compareModel)}
                </div>
                ${rows.map(x => `
                    <div class="text-line" data-line-id="${escapeHtml(x.id)}">
                        <span class="text-line-number"
                              style="color:${VERDICT_COLOR[x.verdict]}">r${x.r} c${x.c}</span>
                        <div class="text-line-content">
                            <div style="opacity:.6;font-size:.85em">${escapeHtml(x.label)}</div>
                            <div><strong>GT:</strong> ${escapeHtml(x.gt) || '<em>empty</em>'}</div>
                            <div style="color:${VERDICT_COLOR[x.verdict]}">
                                <strong>${escapeHtml(state.compareModel)}:</strong>
                                ${escapeHtml(x.pred) || '<em>empty</em>'}
                            </div>
                        </div>
                    </div>`).join('')}`;
        }

        /** First Unicode text inside an element, trimmed. */
        function cellText(elem) {
            for (const u of elem.querySelectorAll('*')) {
                if ((u.localName || u.tagName) === 'Unicode') return (u.textContent || '').trim();
            }
            return '';
        }

        /** Compare key for a cell: exact string match after trimming. */
        function sameText(a, b) { return (a || '').trim() === (b || '').trim(); }

        /**
         * Classify a GT/prediction pair for colouring:
         * match / wrong / missed (GT had text, model gave none) /
         * spurious (model invented text in an empty cell) / empty (both blank).
         */
        function cellVerdict(gt, pred) {
            const g = (gt || '').trim(), p = (pred || '').trim();
            if (!g && !p) return 'empty';
            if (!g && p)  return 'spurious';
            if (g && !p)  return 'missed';
            if (g === p)  return 'match';
            // A difference only in which ditto glyph was used is a normalisation
            // artefact, not a recognition error -- flag it separately so it does
            // not inflate the error count.
            const DITTO = /["\u2033\u201D\u201C\u00AB\u00BB\u02BA]/;
            const stripDitto = t => t.replace(/["\u2033\u201D\u201C\u00AB\u00BB\u02BA]/g, '');
            if (stripDitto(g) === stripDitto(p) && (DITTO.test(g) || DITTO.test(p))) return 'ditto';
            return 'wrong';
        }

        const VERDICT_COLOR = {
            match:    '#2ecc71',
            wrong:    '#e74c3c',
            ditto:    '#3498db',
            missed:   '#f39c12',
            spurious: '#9b59b6',
            empty:    '#bdc3c7',
        };

        /** Load the comparison XML for the current page, if a model is selected. */
        async function loadComparison() {
            state.comparePageXml = null;
            state.compareCells = null;
            const statsEl = document.getElementById('compareStats');
            if (!state.compareModel) {
                statsEl.style.display = 'none';
                return;
            }
            const page = state.pages[state.currentPageIndex];
            const manuscript = state.manuscripts.find(m => m.manuscriptFolder === state.currentManuscript);
            if (!page || !manuscript || !page.compare || !page.compare[state.compareModel]) {
                statsEl.style.display = 'none';
                return;
            }
            try {
                const path = buildManuscriptPath(manuscript, page.compare[state.compareModel]);
                const resp = await fetch(withBase(path));
                if (!resp.ok) throw new Error('not found');
                const doc = new DOMParser().parseFromString(await resp.text(), 'application/xml');
                if (doc.getElementsByTagName('parsererror').length) throw new Error('parse error');
                state.comparePageXml = doc;
                state.compareCells = cellTextMap(doc);
            } catch (e) {
                console.warn('Comparison load failed:', e);
                statsEl.textContent = 'Comparison unavailable for this page';
                statsEl.style.display = '';
                return;
            }
            // Tally verdicts over cells where either side has text.
            const gtCells = cellTextMap(state.currentPageXml);
            let match = 0, wrong = 0, missed = 0, spurious = 0, ditto = 0;
            for (const [k, g] of gtCells) {
                const v = cellVerdict(g, state.compareCells.get(k));
                if (v === 'match') match++;
                else if (v === 'wrong') wrong++;
                else if (v === 'missed') missed++;
                else if (v === 'spurious') spurious++;
                else if (v === 'ditto') ditto++;
            }
            const scored = match + wrong + missed + spurious + ditto;
            const pct = scored ? (100 * match / scored).toFixed(1) : '0.0';
            statsEl.innerHTML =
                `<strong>${pct}% exact</strong> (${match}/${scored})` +
                `<br><span style="color:${VERDICT_COLOR.wrong}">&#9632;</span> wrong ${wrong}` +
                ` <span style="color:${VERDICT_COLOR.missed}">&#9632;</span> missed ${missed}` +
                ` <span style="color:${VERDICT_COLOR.spurious}">&#9632;</span> spurious ${spurious}` +
                ` <span style="color:${VERDICT_COLOR.ditto}">&#9632;</span> ditto ${ditto}`;
            statsEl.style.display = '';
        }


        // ---------------------------------------------------------------
        // CER diagnostics, from a CERberus report (run_cerberus.py).
        // CERberus: https://github.com/WHaverals/CERberus
        // ---------------------------------------------------------------

        /**
         * Confusion pairs that are the same character in different encodings
         * or styles, not a misreading: ditto/quote variants, Arabic vs
         * extended-Arabic digits, comma and dash variants. Counting these as
         * errors inflates CER by up to ~16% on this corpus and reorders the
         * model ranking, so they can be discounted.
         */
        const CER_EQUIV = (() => {
            const pairs = [
                ['"', '〃'], ['״', '"'], ['"', '“'], ['"', '”'],
                ['"', '″'], ['״', '〃'],
                ['،', ','], ['-', '–'], ['-', 'ـ'],
                ['١', '۱'], ['٢', '۲'], ['٣', '۳'],
                ['٤', '۴'], ['٥', '۵'], ['٦', '۶'],
                ['٧', '۷'], ['٨', '۸'], ['٩', '۹'],
                ['٠', '۰'],
            ];
            const set = new Set();
            for (const [a, b] of pairs) { set.add(a + ' ' + b); set.add(b + ' ' + a); }
            return set;
        })();

        function isEquivPair(a, b) { return CER_EQUIV.has(a + ' ' + b); }

        /** Errors attributable purely to encoding variants, for one model. */
        function normalisationErrors(entry) {
            return (entry.confusionStats || [])
                .filter(c => isEquivPair(c.correct, c.generated))
                .reduce((n, c) => n + c.count, 0);
        }

        function totalErrors(entry) {
            return entry.numSub + entry.numIns + entry.numDel;
        }

        /** CER with encoding-variant confusions discounted. */
        function adjustedCer(entry) {
            if (!entry.numCount) return null;
            return (totalErrors(entry) - normalisationErrors(entry)) / entry.numCount * 100;
        }

        /** Printable name for a character in a confusion pair. */
        function charLabel(c) {
            if (c === '_') return '(none)';
            if (c === '\n') return '\\n';
            if (c === ' ') return '(space)';
            return c;
        }

        async function loadCerReport() {
            const el = document.getElementById('cerContent');
            if (state.cerReport) { renderCerReport(); return; }
            try {
                const resp = await fetch(withBase('cerberus_report.json'));
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                state.cerReport = await resp.json();
                renderCerReport();
            } catch (e) {
                el.innerHTML = `<p class="no-text">No CER report found.
                    Generate one with <code>run_cerberus.py</code>.<br>
                    <small>${escapeHtml(e.message)}</small></p>`;
            }
        }

        function renderCerReport() {
            const el = document.getElementById('cerContent');
            const rep = state.cerReport;
            const models = Object.keys(rep);
            if (!models.length) { el.innerHTML = '<p class="no-text">Report is empty.</p>'; return; }

            // Models scored on far fewer characters are partial runs; listing
            // them beside full runs would imply a comparison that isn't valid.
            const maxChars = Math.max(...models.map(m => rep[m].numCount));
            const full = models.filter(m => rep[m].numCount >= maxChars * 0.7);
            const partial = models.filter(m => !full.includes(m));

            const useAdj = state.cerNormalise !== false;
            const score = m => useAdj ? adjustedCer(rep[m]) : rep[m].CER;
            const ranked = [...full].sort((a, b) => score(a) - score(b));
            const sel = state.cerSelected && rep[state.cerSelected]
                ? state.cerSelected : ranked[0];
            const d = rep[sel];

            const blocks = (d.blockStats || []).filter(b => b.count > 0);
            const conf = (d.confusionStats || []).slice(0, 25);
            const normErrs = normalisationErrors(d), errs = totalErrors(d);

            el.innerHTML = `
              <h2>Character Error Rate diagnostics</h2>
              <p style="opacity:.75">
                Computed with <a href="https://github.com/WHaverals/CERberus"
                target="_blank" rel="noopener">CERberus</a> (Haverals) over
                ${escapeHtml(String(full.length))} model outputs against the
                ground-truth pages, one cell per line.
              </p>
              <label style="display:block;margin:1rem 0">
                <input type="checkbox" id="cerNormToggle" ${useAdj ? 'checked' : ''}>
                Discount encoding-variant confusions
                <span style="opacity:.7">(ditto/quote forms, Arabic vs extended-Arabic
                digits, comma and dash variants &mdash; same character, different codepoint)</span>
              </label>

              <h3>Ranking</h3>
              <table class="cer-table">
                <thead><tr><th>#</th><th>model</th><th>CER</th>
                  <th>raw</th><th>sub</th><th>ins</th><th>del</th><th>norm.</th></tr></thead>
                <tbody>
                ${ranked.map((m, i) => {
                    const e = rep[m], adj = adjustedCer(e), ne = normalisationErrors(e);
                    return `<tr class="cer-row${m === sel ? ' cer-active' : ''}" data-model="${escapeHtml(m)}">
                      <td>${i + 1}</td><td>${escapeHtml(m)}</td>
                      <td><strong>${(useAdj ? adj : e.CER).toFixed(2)}%</strong></td>
                      <td style="opacity:.6">${e.CER.toFixed(2)}%</td>
                      <td>${e.numSub}</td><td>${e.numIns}</td><td>${e.numDel}</td>
                      <td>${ne ? ne + ' (' + (100 * ne / totalErrors(e)).toFixed(0) + '%)' : '&mdash;'}</td>
                    </tr>`;
                }).join('')}
                </tbody>
              </table>
              ${partial.length ? `<p style="opacity:.7;font-size:.9em">
                Not ranked (partial runs, fewer pages scored):
                ${partial.map(m => escapeHtml(m) + ' ' + rep[m].CER.toFixed(1) + '%').join(', ')}</p>` : ''}

              <h3>${escapeHtml(sel)} &mdash; accuracy by script</h3>
              <p style="opacity:.75">Where the errors actually fall. A model can look
              respectable overall and still be near-useless on one column type.</p>
              <table class="cer-table">
                <thead><tr><th>block</th><th>chars</th><th>correct</th><th></th></tr></thead>
                <tbody>
                ${blocks.map(b => `<tr>
                    <td>${escapeHtml(b.Block)}</td>
                    <td>${b.count}</td>
                    <td>${b.correct_ratio == null ? '&mdash;' : b.correct_ratio.toFixed(1) + '%'}</td>
                    <td style="width:40%">
                      <div class="cer-bar"><div class="cer-bar-fill"
                        style="width:${b.correct_ratio || 0}%"></div></div>
                    </td>
                  </tr>`).join('')}
                </tbody>
              </table>

              <h3>${escapeHtml(sel)} &mdash; top confusions</h3>
              <p style="opacity:.75">
                ${errs} errors, of which ${normErrs}
                (${errs ? (100 * normErrs / errs).toFixed(1) : '0'}%) are encoding variants.
                Rows marked <span class="cer-equiv-tag">variant</span> are the same
                character in a different codepoint, not a misreading.
              </p>
              <table class="cer-table">
                <thead><tr><th>ground truth</th><th>model read</th><th>count</th><th></th></tr></thead>
                <tbody>
                ${conf.map(c => {
                    const eq = isEquivPair(c.correct, c.generated);
                    return `<tr${eq ? ' class="cer-equiv"' : ''}>
                      <td class="cer-char">${escapeHtml(charLabel(c.correct))}</td>
                      <td class="cer-char">${escapeHtml(charLabel(c.generated))}</td>
                      <td>${c.count}</td>
                      <td>${eq ? '<span class="cer-equiv-tag">variant</span>' : ''}</td>
                    </tr>`;
                }).join('')}
                </tbody>
              </table>`;

            el.querySelectorAll('.cer-row').forEach(tr => {
                tr.addEventListener('click', () => {
                    state.cerSelected = tr.dataset.model;
                    renderCerReport();
                });
            });
            const t = document.getElementById('cerNormToggle');
            if (t) t.addEventListener('change', e => {
                state.cerNormalise = e.target.checked;
                renderCerReport();
            });
        }

        /** Re-measure the map and re-fit the page after a layout/size change. */
        function refitMap() {
            if (!state.leafletMap || !state.fitBounds) return;
            state.leafletMap.invalidateSize(false);
            state.leafletMap.fitBounds(state.fitBounds, { padding: [10, 10], animate: false });
        }
        window.addEventListener('resize', () => refitMap());

        /**
         * Collect region-like elements: TextRegion and TableCell (PAGE table cells
         * are region-level containers and hold their own TextLine children).
         * Namespace-safe: matches on localName.
         */
        function collectRegions(root) {
            const out = [];
            for (const elem of root.querySelectorAll('*')) {
                const n = elem.localName || elem.tagName;
                if (n === 'TextRegion' || n === 'TableCell') out.push(elem);
            }
            return out;
        }

        /** Human label for a region: table cells get row/col + structure type. */
        function regionLabel(region) {
            const n = region.localName || region.tagName;
            const id = region.getAttribute('id') || 'unknown';
            if (n !== 'TableCell') return `Text region - ${id}`;
            const row = region.getAttribute('row'), col = region.getAttribute('col');
            const m = /structure\s*\{[^}]*type:([^;}]+)/.exec(region.getAttribute('custom') || '');
            const type = m ? m[1].trim() : '';
            return `Cell r${row} c${col}${type ? ' - ' + type : ''}`;
        }

        /** All descendant TextLines of a region. */
        function collectLines(region) {
            const out = [];
            for (const elem of region.querySelectorAll('*')) {
                const n = elem.localName || elem.tagName;
                if (n === 'TextLine') out.push(elem);
            }
            return out;
        }

        /** First Coords *child* of an element (not of its descendants). */
        function ownCoords(elem) {
            for (const c of elem.children) {
                if ((c.localName || c.tagName) === 'Coords') return c;
            }
            return null;
        }

        /** Parse a PAGE points string into Leaflet [lat,lng] with Y inverted. */
        function parsePoints(pointsStr, imageHeight) {
            if (!pointsStr) return [];
            return pointsStr.trim().split(/\s+/).map(p => {
                const parts = p.split(',');
                if (parts.length !== 2) return null;
                const x = parseFloat(parts[0]), y = parseFloat(parts[1]);
                if (!isFinite(x) || !isFinite(y)) return null;
                return [imageHeight - y, x];
            }).filter(Boolean);
        }

        /**
         * Toggle polygon overlay visibility
         */
        function togglePolygons(checked) {
            state.polygonsVisible = checked;
            
            if (state.polygonsVisible && state.currentPageXml) {
                renderPolygons();
            } else {
                clearPolygons();
            }
        }

        /**
         * Render text region polygons from PageXML
         */
        function renderPolygons() {
            clearPolygons();
            
            if (!state.leafletMap || !state.currentPageXml) {
                console.warn('Cannot render polygons: map or XML missing');
                return;
            }

            console.log(`Rendering polygons for image ${state.imageWidth}x${state.imageHeight}, PageXML says ${state.pageWidth}x${state.pageHeight}`);

            const LINE_COLOR = '#85c1e9';
            // Distinct hues so adjacent columns stay separable at a glance.
            const COL_COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c',
                                '#3498db','#9b59b6','#e84393','#16a085','#d35400'];
            let polygonsCreated = 0;

            const regions = collectRegions(state.currentPageXml);
            console.log(`Found ${regions.length} regions (TextRegion + TableCell) in PageXML`);

            const addPoly = (points, opts, id, tooltip) => {
                if (points.length < 3) return;
                try {
                    const poly = L.polygon(points, opts).addTo(state.leafletMap);
                    poly.lineId = id;
                    if (tooltip) poly.bindTooltip(tooltip, { sticky: true, direction: 'top' });
                    poly.on('mouseover', () => { if (!state.highlightLocked) highlightLineAndPolygon(id); });
                    poly.on('mouseout', () => { if (!state.highlightLocked) clearHighlight(); });
                    poly.on('click', () => { state.highlightLocked = true; highlightLineAndPolygon(id, false); });
                    state.polygonLayers.push(poly);
                    polygonsCreated++;
                } catch (e) {
                    console.error('Error creating polygon', id, e);
                }
            };

            regions.forEach((region) => {
                const isCell = (region.localName || region.tagName) === 'TableCell';
                const regionId = region.getAttribute('id') || 'region';

                // Draw the cell/region outline itself. This is the key change for
                // tabular material: cells are geometry even when they hold no text.
                const rc = ownCoords(region);
                if (rc) {
                    const col = parseInt(region.getAttribute('col'), 10);
                    let color = isCell && isFinite(col)
                        ? COL_COLORS[col % COL_COLORS.length]
                        : '#95a5a6';
                    let fillOpacity = 0.08;
                    let tip = regionLabel(region);

                    // When comparing against a model, colour by GT/prediction verdict
                    // instead of by column, and put both readings in the tooltip.
                    if (isCell && state.compareCells) {
                        const key = `${region.getAttribute('row')},${region.getAttribute('col')}`;
                        const gtText = cellText(region);
                        const predText = state.compareCells.get(key) || '';
                        const verdict = cellVerdict(gtText, predText);
                        if (verdict === 'empty') {
                            color = VERDICT_COLOR.empty;
                            fillOpacity = 0;
                        } else {
                            color = VERDICT_COLOR[verdict];
                            fillOpacity = 0.35;
                        }
                        tip = `${regionLabel(region)}<br>GT: ${escapeHtml(gtText) || '<em>empty</em>'}`
                            + `<br>${escapeHtml(state.compareModel)}: ${escapeHtml(predText) || '<em>empty</em>'}`;
                    }

                    addPoly(
                        parsePoints(rc.getAttribute('points'), state.imageHeight),
                        { color, weight: 1, opacity: 0.9, fillColor: color,
                          fillOpacity, className: 'region-polygon' },
                        regionId,
                        tip
                    );
                }

                // Draw TextLine polygons on top, as before.
                collectLines(region).forEach((line, lineIdx) => {
                    const lineId = line.getAttribute('id') || `line_${regionId}_${lineIdx}`;
                    const lc = ownCoords(line);
                    if (!lc) return;
                    addPoly(
                        parsePoints(lc.getAttribute('points'), state.imageHeight),
                        { color: LINE_COLOR, weight: 2, opacity: 1, fillColor: LINE_COLOR,
                          fillOpacity: 0.2, className: 'text-line-polygon' },
                        lineId,
                        regionLabel(region)
                    );
                });
            });

            console.log(`Successfully rendered ${polygonsCreated} polygons`);
        }

        /**
         * Highlight a transcription line and its corresponding polygon
         */
        function highlightLineAndPolygon(lineId, shouldPan = false) {
            console.log(`highlightLineAndPolygon called with lineId: ${lineId}, shouldPan: ${shouldPan}`);
            
            // Highlight the text line in transcription
            document.querySelectorAll('.text-line').forEach(elem => {
                const matches = elem.dataset.lineId === lineId;
                if (matches) {
                    console.log(`  ✓ MATCH! Highlighting text-line with data-line-id="${lineId}"`);
                }
                elem.classList.toggle('highlighted', matches);
            });
            
            // Scroll to the highlighted line in the text content area (only when panning)
            if (shouldPan) {
                const highlightedLine = document.querySelector(`.text-line[data-line-id="${lineId}"]`);
                if (highlightedLine) {
                    highlightedLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
            
            // Highlight the polygon on the map and pan to it if found
            let targetPolygon = null;
            state.polygonLayers.forEach(polygon => {
                if (polygon.lineId === lineId) {
                    console.log(`    ✓ MATCH! Highlighting polygon with lineId="${lineId}"`);
                    targetPolygon = polygon;
                    polygon.setStyle({
                        color: '#f39c12',
                        weight: 3,
                        opacity: 1,
                        fillColor: '#f39c12',
                        fillOpacity: 0.4
                    });
                } else {
                    polygon.setStyle({
                        color: '#85c1e9',
                        weight: 2,
                        opacity: 1,
                        fillColor: '#85c1e9',
                        fillOpacity: 0.2
                    });
                }
            });
            
            // Pan map to show the highlighted polygon (only when requested)
            if (shouldPan && targetPolygon && state.leafletMap) {
                const bounds = targetPolygon.getBounds();
                state.leafletMap.panTo(bounds.getCenter(), { animate: true, duration: 0.5 });
            }
        }

        /**
         * Clear all highlighting
         */
        function clearHighlight() {
            // Remove highlight from all text lines
            document.querySelectorAll('.text-line').forEach(elem => {
                elem.classList.remove('highlighted');
            });
            
            // Reset all polygons to default style
            state.polygonLayers.forEach(polygon => {
                polygon.setStyle({
                    color: '#85c1e9',
                    weight: 2,
                    opacity: 1,
                    fillColor: '#85c1e9',
                    fillOpacity: 0.2
                });
            });
        }

        /**
         * Clear all polygon layers
         */
        function clearPolygons() {
            state.polygonLayers.forEach(layer => {
                if (state.leafletMap) {
                    state.leafletMap.removeLayer(layer);
                }
            });
            state.polygonLayers = [];
        }

        /**
         * Escape HTML special characters
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
   
</body>
</html>
